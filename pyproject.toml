[project]
name = "legal-ai-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.43.29",
    "celery[redis]>=5.6.3",
    "clerk-backend-api>=6.0.1",
    "fastapi>=0.136.3",
    "langchain-openai>=1.3.1",
    "python-dotenv>=1.2.2",
    "scrapingbee>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "supabase>=2.31.0",
    "unstructured>=0.18.32",
    "pdfminer.six>=20221105",
    "pypdf>=4.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "uvicorn[standard]>=0.34.0",
    "pi-heif>=1.4.0",
    "pikepdf>=10.8.0",
    "pdf2image>=1.17.0",
    "unstructured-inference>=1.1.1",
    "onnxruntime>=1.19.0,<1.20",
    "markdown>=3.10.2",
    "unstructured-pytesseract>=0.3.15",
    "llama-index-core>=0.12.0",
    "llama-index-llms-openai>=0.3.0",
    "llama-index-embeddings-openai>=0.3.0",
    "langgraph>=1.2.7",
    "langsmith>=0.8.0",
]

# PyTorch / Numba / pikepdf dropped Intel Mac wheels in recent versions.
# transformers>=5 requires torch>=2.4 and crashes with NameError: nn is not defined.
[tool.uv]
override-dependencies = [
    "torch==2.2.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchvision==0.17.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numba==0.62.1 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llvmlite==0.45.1 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pikepdf==9.11.0 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers>=4.45.0,<5 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
